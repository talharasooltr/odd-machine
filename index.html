<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <title>Odd Machine — Nobody knows what it does</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind.config.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="flex items-center gap-3">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="14" height="14" fill="none"><path d="m11.4 1.8-6 9h4l-.8 7.4 6-10h-4.1l.9-6.4Z" fill="currentColor"/></svg>
        </span>
        <span class="micro !text-[#d0d1c6]">Odd machine <span class="text-[#66685f]">/ 001</span></span>
      </div>
      <div class="flex items-center gap-2">
        <button class="top-action" id="sound-toggle" type="button" aria-label="Turn sound on" aria-pressed="false" title="Sound">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8v4h3l4 3V5L6 8H3Z"/><path d="M13 7.2a4 4 0 0 1 0 5.6M15.4 5a7 7 0 0 1 0 10" opacity=".5"/></svg>
        </button>
        <button class="top-action" id="reset-button" type="button" aria-label="Reset machine" title="Reset machine">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 8a6.8 6.8 0 1 1-.1 4M3.4 3.7V8h4.3"/></svg>
        </button>
      </div>
    </header>

    <main class="stage" id="stage" aria-label="Machine workbench">
      <div class="stage-heading micro"><span class="status-light" id="status-light"></span><span id="power-status">No current</span></div>
      <div class="stage-clock micro" id="clock">00:00:00</div>
      <svg class="wires" id="wires" aria-hidden="true"></svg>
      <div class="empty-state" id="empty-state"><div><div class="empty-mark">+</div><strong>Nothing is waiting to be built.</strong><br><span>Take a part. Put it somewhere.</span></div></div>
      <div class="stage-copy"><h1>Build a machine.<br><em>Find out why.</em></h1><p id="stage-hint">Nobody knows what it does. That's the point.</p></div>
      <div class="freeze-overlay" id="freeze-overlay"><strong>Time is taking a break.</strong><span>Tap the little black box to let it go.</span></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <footer class="toolbar">
      <div class="parts-row" id="parts-row" aria-label="Machine parts"></div>
      <div class="toolbar-foot">
        <span id="tool-hint">Drag a part onto the bench</span>
        <div class="foot-right"><span id="part-count">0 parts</span><button class="text-button" id="clear-button" type="button">Clear bench</button></div>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
